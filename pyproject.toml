[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "basta-credit-service"
version = "1.0.0"
description = "Recoverable asynchronous credit processing with FastAPI, Celery and MongoDB"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "celery>=5.6,<6",
  "pymongo>=4.11,<5", "pydantic-settings>=2.7,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["credit_service*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires the real MongoDB replica set", "e2e: requires the complete running stack"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
